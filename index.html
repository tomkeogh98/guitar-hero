<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guitar Hero · Tom's practice notebook</title>
  <meta name="description" content="Tom's guitar practice notebook: daily lessons, tracker, goals and recordings.">
  <meta name="theme-color" content="#F3EEE4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0E0C" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1.5C18.6 1.5 22.5 5 22.5 9.6C22.5 15.8 15.6 22.5 12 22.5C8.4 22.5 1.5 15.8 1.5 9.6C1.5 5 5.4 1.5 12 1.5Z' fill='%23FF4F1F'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Guitar Hero">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("gh.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&family=Instrument+Sans:wght@400..700&family=Courier+Prime:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/" aria-label="Guitar Hero home">
        <svg viewBox="0 0 24 24" class="brand-pick" aria-hidden="true"><path d="M12 1.5C18.6 1.5 22.5 5 22.5 9.6C22.5 15.8 15.6 22.5 12 22.5C8.4 22.5 1.5 15.8 1.5 9.6C1.5 5 5.4 1.5 12 1.5Z"/></svg>
        <span class="brand-name">Guitar Hero</span>
        <span class="brand-sub">Tom's practice notebook</span>
      </a>
      <nav aria-label="Main" id="nav">
        <span class="nav-ink" aria-hidden="true"></span>
        <a href="#/" data-icon="today">Today</a>
        <a href="#/tracker" data-icon="calendar">Tracker</a>
        <a href="#/goals" data-icon="target">Goals</a>
        <a href="#/tapes" data-icon="tape">Tapes</a>
        <a href="#/settings" data-icon="sliders">Settings</a>
      </nav>
      <div class="top-tools">
        <button id="sync" class="chip sync" type="button" data-status="off"><i></i><span>local only</span></button>
        <button id="tuner-btn" class="chip tuner-chip" type="button" title="Open the tuner"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v7a3 3 0 0 0 6 0V3"/><path d="M12 13v8M9.5 21h5"/></svg><span>Tuner</span></button>
        <button id="theme" class="icon-btn" type="button" aria-label="Switch light or dark mode"></button>
      </div>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer class="foot"><span>Keep it fun.</span> Free play is always allowed.</footer>
  <noscript><p class="card">This notebook needs JavaScript switched on.</p></noscript>
  <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
